server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # (necesario para react-router-dom en modo BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck simple para probes de Kubernetes / ALB
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~* \.(?:css|js|svg|png|jpe?g|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
